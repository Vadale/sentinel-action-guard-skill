<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img"><title>sentinel-action-guard workflow</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#192c42"/></linearGradient></defs><rect width="1280" height="330" fill="url(#bg)"/><g font-family="DejaVu Sans,sans-serif"><text x="54" y="59" fill="#6de5c0" font-size="18" font-weight="600">HOW IT WORKS</text><rect x="54" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="77" y="133" fill="#6de5c0" font-size="20" font-weight="600">01</text><text x="77" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Propose</text><text x="77" y="215" fill="#c5d0df" font-size="17" font-weight="400">Bounded UTF-8 text</text><text x="77" y="244" fill="#c5d0df" font-size="17" font-weight="400">and an enrolled destination</text><path d="M424 183h25m-8-7 8 7-8 7" fill="none" stroke="#6de5c0" stroke-width="2"/><rect x="462" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="485" y="133" fill="#6de5c0" font-size="20" font-weight="600">02</text><text x="485" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Decide</text><text x="485" y="215" fill="#c5d0df" font-size="17" font-weight="400">Policy plus separate operator</text><text x="485" y="244" fill="#c5d0df" font-size="17" font-weight="400">for actions that need approval</text><path d="M832 183h25m-8-7 8 7-8 7" fill="none" stroke="#6de5c0" stroke-width="2"/><rect x="870" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="893" y="133" fill="#6de5c0" font-size="20" font-weight="600">03</text><text x="893" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Create</text><text x="893" y="215" fill="#c5d0df" font-size="17" font-weight="400">Exact approved bytes</text><text x="893" y="244" fill="#c5d0df" font-size="17" font-weight="400">or no new artifact</text></g></svg>
